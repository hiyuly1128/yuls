  <style>@font-face {
  font-family: "DSEG7";
  src: url("https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Regular.woff2") format("woff2"),
       url("https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Regular.woff") format("woff");
  font-display: swap;
}

:root {
  --ink: #111;
  --blue: #4a43ff;
  --red: #ff3131;
  --orange: #ff7f0a;
  --wall: #fffcf5;
  --board: #52453f;
  --paper: #fffdf7;

  /* flower colors, changed per season below */
  --petal: #ffc27a;
  --core: #f0a04b;
  --stem: #1f9d5b;
  --petal-line: transparent;
}

[data-season="winter"] { --wall: #f6faff; --petal: #f3f9ff; --core: #8fbbe8; --petal-line: #b9d6f2; }
[data-season="spring"] { --wall: #fffaf8; --petal: #ff9ec7; --core: #ffe27a; }
[data-season="summer"] { --wall: #fffdf0; --petal: #ffd23f; --core: #6b3f1d; }
[data-season="fall"]   { --wall: #fffcf5; --petal: #ffa24d; --core: #a8431a; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  color: var(--ink);
  background: #fff;
}
body.book-open { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

/* Everything on the welcome page and library scales from one unit (1em),
   so the layout keeps its proportions from phone to desktop. */
.stage {
  width: 100%;
  max-width: 1000px;
  margin-inline: auto;
  font-size: min(1vw, 10px);
}

.view { animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(1.2em); } to { opacity: 1; transform: none; } }

/* ================= WELCOME ================= */
#welcome { padding-top: 6em; min-height: 100vh; }

h1 {
  margin: 0 0 2.4em;
  text-align: center;
  font-size: 6.6em;
  line-height: 1.1;
  font-weight: 800;
  letter-spacing: -.01em;
}

.card {
  display: block;
  width: 22em;
  height: 14em;
  border: 0;
  border-radius: 3.4em;
  transition: transform .22s ease, box-shadow .22s ease;
}
.card-black { background: #000; }
.card-blue  { background: var(--blue); }
.card-red   { background: var(--red); }
.card:hover, .card:focus-visible { transform: translateY(-.8em); box-shadow: 0 1.2em 2em rgba(0,0,0,.18); }
.card:active { transform: scale(.97); }

.card-stack { position: relative; width: 41.3em; height: 14em; margin: 0 auto 4.2em; }
.card-stack .card { position: absolute; top: 0; }
.card-stack .card-black { left: 0;      z-index: 1; }
.card-stack .card-blue  { left: 8.4em;  z-index: 2; }
.card-stack .card-red   { left: 19.3em; z-index: 3; }
.card-stack:hover .card-blue { translate: 1.4em 0; }
.card-stack:hover .card-red  { translate: 3em 0; }

.card-row { display: flex; justify-content: center; gap: 8.1em; }

.hint {
  text-align: center;
  margin: 4em 0 0;
  font-size: max(1.7em, 14px);
  color: #666;
}

/* ================= LIBRARY ================= */
.lib-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.6em 2em;
  font-size: max(1.7em, 14px);
}
.link-btn { background: none; border: 0; padding: .3em .2em; font-weight: 600; }
.link-btn:hover { text-decoration: underline; }
.lib-title { font-weight: 800; letter-spacing: -.01em; }

.shelves { background: var(--wall); padding-top: 3.1em; padding-bottom: 4.5em; transition: background .4s; }
.shelf-items {
  display: flex; align-items: flex-end;
  padding: 0 3.2em;
}
.board { height: 2em; background: var(--board); margin: 0 1.7em; }
.shelf-2 { margin-top: 3.3em; }
.shelf-2 .shelf-items { padding: 0 5.8em 0 5.6em; }

/* ---- books ---- */
.book {
  flex: none;
  border: 0; padding: 0;
  display: flex; align-items: center; justify-content: center;
  transition: transform .18s ease, filter .18s ease;
}
.book:hover, .book:focus-visible { transform: translateY(-1em); filter: brightness(1.06); }
.spine {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font-weight: 700;
  font-size: max(1.5em, 11px);
  letter-spacing: .06em;
  white-space: nowrap;
}

.book-about      { width: 8.2em; height: 22.8em; background: var(--blue);  color: #fff; }
.book-experience { width: 5em;   height: 23.6em; background: var(--orange); color: #fff; margin-left: .6em; }
.book-projects   { width: 5em;   height: 23.6em; background: #e5a95c;       color: #3a2a14; margin-left: .5em; }
.book-writing {
  width: 4.5em; height: 15em; background: #e35454; color: #fff;
  margin-left: .8em; transform: rotate(12deg); transform-origin: bottom left;
}
.book-writing:hover, .book-writing:focus-visible { transform: rotate(12deg) translateY(-1em); }
.book-skills  { width: 6.5em; height: 25.8em; background: #f5479b; color: #fff; margin-left: auto; }
.book-contact { width: 9.8em; height: 28.7em; background: #04783c; color: #fff; margin-left: .9em; }

/* ---- clock ---- */
.clock {
  margin-left: auto; margin-right: 10.8em;
  width: 26.5em; height: 12.6em;
  background: #e1f0fd;
  border-radius: 3em;
  display: flex; flex-direction: column; justify-content: center;
  padding: 0 2.6em;
  overflow: hidden;
}
.book-writing + .clock { margin-left: auto; }
.clock-time {
  font-family: "DSEG7", "VT323", monospace;
  font-size: 4.8em;
  line-height: 1.05;
  letter-spacing: .04em;
  white-space: nowrap;
}
.clock-time .colon { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: .15; } }
.clock-date {
  font-family: "Pixelify Sans", "VT323", monospace;
  font-size: max(1.3em, 9px);
  white-space: nowrap;
  margin-top: .3em;
}

/* ---- stickies ---- */
.stickies { position: relative; width: 16em; height: 26.5em; flex: none; display: block; text-decoration: none; color: inherit; transition: transform .18s; }
.stickies:hover, .stickies:focus-visible { transform: translateY(-.8em) rotate(-1.5deg); }
.sticky { position: absolute; display: block; }
.s-back  { left: 0;     bottom: 12.7em; width: 11.5em; height: 11.2em; background: #f9f98c; }
.s-front { left: 4.4em; bottom: 15.2em; width: 11.6em; height: 11.3em; background: #fbfd96; display: flex; align-items: center; justify-content: center; text-align: center; padding: .6em; }
.s-front em { font-family: "Pixelify Sans", monospace; font-style: normal; font-size: max(1.5em, 10px); line-height: 1.15; color: #6b6b1f; }
.s-strip { left: 0;     bottom: 5.6em;  width: 11.5em; height: 2.5em;  background: #fbfb8e; }
.s-pink  { left: 1.35em; bottom: 0;     width: 11.6em; height: 5.6em;  background: #ffdcf7; }

/* ---- vase + flower ---- */
.vase {
  position: relative; flex: none;
  width: 12.4em; height: 15em;
  margin-left: 2.7em;
  border: 0; background: none; padding: 0;
}
.vase-body {
  position: absolute; left: 0; right: 0; top: 0; bottom: 1.6em;
  background: #bbdffc;
  border-radius: .8em .8em 4.4em 4.4em;
  display: flex; align-items: flex-end; justify-content: center; padding-bottom: 2em;
}
.vase-foot {
  position: absolute; left: 1.4em; right: 1.4em; bottom: 0; height: 2.4em;
  background: #bbdffc; border-radius: 1.2em 1.2em .6em .6em;
}
.season-label {
  position: relative; z-index: 3;
  font-family: "Pixelify Sans", monospace; font-weight: 600;
  font-size: max(1.5em, 9px);
  color: #2b5f8f;
}
.flower {
  position: absolute; left: 50%; bottom: 1em;
  width: 14em; height: auto;
  translate: -50% 0;
  z-index: 2;
  overflow: visible;
  transition: transform .25s;
  transform-origin: 50% 100%;
}
.vase:hover .flower, .vase:focus-visible .flower { transform: rotate(4deg); }
.flower .stem   { fill: var(--stem); }
.flower .leaf   { fill: var(--stem); }
.flower .petals { fill: var(--petal); stroke: var(--petal-line); stroke-width: 1.5; stroke-linejoin: round; transition: fill .4s; }
.flower .core   { fill: var(--core); transition: fill .4s; }
[data-season="winter"] .flower .leaf { display: none; }

/* ================= OPEN BOOK (notes) ================= */
.open-book {
  display: grid; grid-template-columns: 1fr 1fr;
  min-height: max(50em, 430px);
  border: .6em solid var(--orange);
  border-radius: 1.4em;
  background: #fff;
  overflow: hidden;
  scroll-margin-top: 1em;
}
.page { padding: 2.6em 2.8em; font-size: max(1.6em, 14px); min-width: 0; }
.page-left { border-right: 2px solid #e8e8e8; }
.page h2 { margin: 0 0 .5em; font-size: 1.25em; }
.page-sub { margin: 0 0 1.2em; color: #666; font-size: .92em; line-height: 1.45; }

.notes-list { display: grid; gap: .9em; }
.note { background: #fffbe0; padding: .9em 1em; border-radius: .5em; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.note p { margin: 0 0 .5em; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.note small { color: #7a7a55; }
.empty { color: #888; line-height: 1.5; }

form label { display: block; font-weight: 600; margin: 1em 0 .3em; font-size: .92em; }
form label span { font-weight: 400; color: #888; }
input, textarea {
  width: 100%; font: inherit; font-size: 1em;
  padding: .6em .7em;
  border: 2px solid #ddd; border-radius: .5em;
  background: #fff;
}
textarea { resize: vertical; min-height: 7em; }
input:focus, textarea:focus { outline: none; border-color: var(--orange); }
.send {
  margin-top: 1em;
  background: var(--ink); color: #fff;
  border: 0; border-radius: 999px;
  padding: .7em 1.4em; font-weight: 700;
}
.send:hover { background: var(--blue); }
.status { min-height: 1.4em; margin: .8em 0 0; font-size: .9em; color: #444; }
.status.err { color: #c11; }

.foot { padding: 2.4em 0 4em; text-align: center; color: #888; font-size: max(1.4em, 13px); }

/* ================= FULL-SCREEN BOOK ================= */
.book-view {
  position: fixed; inset: 0; z-index: 50;
  overflow-y: auto;
  background: var(--paper);
  animation: openBook .3s ease both;
}
@keyframes openBook { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }

.book-head { padding: 1.4rem 1.5rem 3rem; }
.book-head > * { max-width: 760px; margin-inline: auto; }
.close-btn {
  display: block;
  background: rgba(255,255,255,.2); color: inherit;
  border: 2px solid currentColor; border-radius: 999px;
  padding: .45rem 1rem; font-weight: 700; font-size: .95rem;
  margin-bottom: 2.4rem;
}
.close-btn:hover { background: rgba(255,255,255,.35); }
.book-head h2 { margin: 0; font-size: clamp(2.4rem, 8vw, 4.2rem); line-height: 1.05; letter-spacing: -.02em; }
.book-head p { margin: .6rem auto 0; font-size: 1.15rem; opacity: .9; }

.book-body { max-width: 760px; margin: 0 auto; padding: 2.2rem 1.5rem 1rem; }
.book-body section { margin-bottom: 2.6rem; }
.book-body h3 { margin: 0 0 1rem; font-size: 1.5rem; }
.book-body p { line-height: 1.65; font-size: 1.08rem; margin: 0 0 1rem; }
.entry { padding: 1.1rem 0; border-top: 1px solid #e6e1d4; }
.entry:last-child { border-bottom: 1px solid #e6e1d4; }
.entry h4 { margin: 0; font-size: 1.15rem; }
.entry .meta { margin: .25rem 0 0; color: #777; font-size: .95rem; }
.entry p { margin: .5rem 0 0; font-size: 1.02rem; }
.entry a, .links a { color: var(--blue); font-weight: 600; }
.links { list-style: none; padding: 0; margin: 0; display: grid; gap: .8rem; font-size: 1.15rem; }

.book-nav {
  max-width: 760px; margin: 0 auto; padding: 1rem 1.5rem 4rem;
  display: flex; justify-content: space-between; gap: 1rem;
}
.book-nav button {
  border: 2px solid var(--ink); background: none; border-radius: 999px;
  padding: .55rem 1.1rem; font-weight: 700;
}
.book-nav button:hover { background: var(--ink); color: #fff; }

/* ================= SMALL SCREENS ================= */
@media (max-width: 640px) {
  .open-book { grid-template-columns: 1fr; }
  .page-left { border-right: 0; border-bottom: 2px solid #e8e8e8; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

          <button class="book book-contact" type="button" data-book="contact"><span class="spine"></span></button>
        </div>
        <div class="board"></div>
      </div>
    </section>

    <!-- Open book = visitor notes -->
    <section class="open-book" id="notes" aria-labelledby="notesTitle">
      <div class="page page-left">
        <h2 id="notesTitle">Notes from visitors</h2>

      </div>
      <div class="page page-right">
        <h2>Leave a note</h2>

          <p id="noteStatus" class="status" role="status"></p>
        </form>

    </section>

    <footer class="foot">&copy; <span id="year"></span> Yul Kim</footer>
  </div>

  <!-- ============ BOOK (full screen) ============ -->
  <div id="bookView" class="book-view" hidden role="dialog" aria-modal="true" aria-labelledby="bookTitle">
    <div class="book-head" id="bookHead">

    <div class="book-body" id="bookBody"></div>
    <nav class="book-nav" id="bookNav" aria-label="Other books"></nav>

        text:
          "Papers and essays will be added here as I finish them. Leave me a note on the open book below if there's something you'd like to read."
      }
    ]
  },

  skills: {
    title: "Skills",
    subtitle: "Languages and tools",
    color: "#f5479b",
    ink: "#ffffff",
    sections: [
      {
        heading: "Languages",
        items: [
          { title: "English", meta: "Native", text: "" },
          { title: "Korean", meta: "Native", text: "" },
          { title: "Mandarin", meta: "HSK 3 · working toward professional proficiency", text: "" }
        ]
      },
      {
        heading: "Tools",
        text: "Adobe InDesign, Illustrator, Photoshop, and Canva."
      }
    ]
  },

  contact: {
    title: "Contact",
    subtitle: "Say hello",
    color: "#04783c",
    ink: "#ffffff",
    sections: [
      {
        heading: "Find me",
        // "email", "github" and "linkedin" are pulled from SITE above.
        links: ["email", "github", "linkedin"]
      }
    ]
  }
};

/* ----------------------------------------------------------
   PUBLISHED NOTES. When someone sends you a note and you
   want to show it, copy the pattern below into this list.
   ---------------------------------------------------------- */
const NOTES = [
  // { name: "Alex", text: "Love the library idea!", date: "2026-11-26" },
];

(() => {
  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];

  function h(tag, props = {}, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v);
    }
    for (const kid of kids.flat()) if (kid != null) el.append(kid);
    return el;
  }

  const welcome = $("#welcome");
  const library = $("#library");
  const bookView = $("#bookView");
  const order = Object.keys(BOOKS);
  let lastOpener = null;

  /* ---------- views + routing (#library, #book/about) ---------- */
  let currentView = null;
  function setView(name) {
    document.body.dataset.view = name;
    welcome.hidden = name !== "welcome";
    library.hidden = name !== "library";
    if (currentView !== name) window.scrollTo(0, 0);
    currentView = name;
  }

  function route() {
    const hash = location.hash.replace(/^#/, "");
    if (hash.startsWith("book/") && BOOKS[hash.slice(5)]) {
      setView("library");
      renderBook(hash.slice(5));
      return;
    }
    closeBookUI();
    if (hash === "library" || hash === "notes") setView("library");
    else setView("welcome");
    if (hash === "notes") requestAnimationFrame(() => $("#notes").scrollIntoView());
  }
  window.addEventListener("hashchange", route);

  $$(".card").forEach(c => c.addEventListener("click", () => { location.hash = "#library"; }));
  $("#backToWelcome").addEventListener("click", () => { location.hash = ""; });

  /* ---------- clock ---------- */
  const clockTime = $("#clockTime");
  const clockDate = $("#clockDate");
  function tick() {
    const d = new Date();
    const hh = String(d.getHours()).padStart(2, "0");
    const mm = String(d.getMinutes()).padStart(2, "0");
    clockTime.replaceChildren(hh, h("span", { class: "colon", text: ":" }), mm);
    clockDate.textContent = d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  }
  tick();
  setInterval(tick, 1000);

  /* ---------- season flower ---------- */
  const SEASONS = ["winter", "spring", "summer", "fall"];
  const SEASON_NAMES = { winter: "Winter", spring: "Spring", summer: "Summer", fall: "Fall" };
  function seasonFor(d) {
    const m = d.getMonth();
    if (m === 11 || m < 2) return "winter";
    if (m < 5) return "spring";
    if (m < 8) return "summer";
    return "fall";
  }
  function starPoints(cx, cy, R, r, n) {
    const pts = [];
    for (let i = 0; i < n * 2; i++) {
      const rad = i % 2 === 0 ? R : r;
      const a = (Math.PI / n) * i - Math.PI / 2;
      pts.push((cx + rad * Math.cos(a)).toFixed(1) + "," + (cy + rad * Math.sin(a)).toFixed(1));
    }
    return pts.join(" ");
  }
  $("#petals").setAttribute("points", starPoints(50, 34, 34, 20, 8));

  let season = seasonFor(new Date());
  function applySeason() {
    document.body.dataset.season = season;
    $("#seasonLabel").textContent = SEASON_NAMES[season];
  }
  applySeason();
  $("#vase").addEventListener("click", () => {
    season = SEASONS[(SEASONS.indexOf(season) + 1) % SEASONS.length];
    applySeason();
  });

  /* ---------- spines ---------- */
  $$(".book").forEach(btn => {
    const id = btn.dataset.book;
    const data = BOOKS[id];
    if (!data) return;
    $(".spine", btn).textContent = data.title;
    btn.setAttribute("aria-label", `Open book: ${data.title}`);
    btn.addEventListener("click", () => { lastOpener = btn; location.hash = "#book/" + id; });
  });

  /* ---------- full-screen book ---------- */
  function renderBook(id) {
    const b = BOOKS[id];
    const head = $("#bookHead");
    head.style.background = b.color;
    head.style.color = b.ink;
    $("#bookTitle").textContent = b.title;
    $("#bookSub").textContent = b.subtitle || "";

    const body = $("#bookBody");
    body.replaceChildren();
    for (const s of b.sections) {
      const sec = h("section", {}, h("h3", { text: s.heading }));
      if (s.text) sec.append(h("p", { text: s.text }));
      if (s.items) {
        for (const it of s.items) {
          const entry = h("div", { class: "entry" }, h("h4", { text: it.title }));
          if (it.meta) entry.append(h("p", { class: "meta", text: it.meta }));
          if (it.text) entry.append(h("p", { text: it.text }));
          if (it.link) entry.append(h("p", {}, h("a", { href: it.link, target: "_blank", rel: "noopener", text: it.linkText || "Open" })));
          sec.append(entry);
        }
      }
      if (s.links) {
        const ul = h("ul", { class: "links" });
        for (const key of s.links) {
          if (key === "email" && SITE.email) ul.append(h("li", {}, "Email: ", h("a", { href: "mailto:" + SITE.email, text: SITE.email })));
          if (key === "github" && SITE.github) ul.append(h("li", {}, "GitHub: ", h("a", { href: SITE.github, target: "_blank", rel: "noopener", text: SITE.github.replace(/^https?:\/\//, "") })));
          if (key === "linkedin" && SITE.linkedin) ul.append(h("li", {}, "LinkedIn: ", h("a", { href: SITE.linkedin, target: "_blank", rel: "noopener", text: "Connect with me" })));
        }
        if (!ul.children.length) ul.append(h("li", { text: "Contact details coming soon." }));
        sec.append(ul);
      }
      body.append(sec);
    }

    const i = order.indexOf(id);
    const prev = order[(i - 1 + order.length) % order.length];
    const next = order[(i + 1) % order.length];
    $("#bookNav").replaceChildren(
      h("button", { type: "button", text: "\u2190 " + BOOKS[prev].title, onclick: () => { location.hash = "#book/" + prev; } }),
      h("button", { type: "button", text: BOOKS[next].title + " \u2192", onclick: () => { location.hash = "#book/" + next; } })
    );

    bookView.hidden = false;
    bookView.scrollTop = 0;
    document.body.classList.add("book-open");
    $("#bookClose").focus({ preventScroll: true });
  }

  function closeBookUI() {
    if (bookView.hidden) return;
    bookView.hidden = true;
    document.body.classList.remove("book-open");
    if (lastOpener) lastOpener.focus({ preventScroll: true });
  }

  $("#bookClose").addEventListener("click", () => { location.hash = "#library"; });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !bookView.hidden) location.hash = "#library";
  });

  /* ---------- notes ---------- */
  function renderNotes() {
    const list = $("#notesList");
    list.replaceChildren();
    if (!NOTES.length) {
      list.append(h("p", { class: "empty", text: "No notes yet. Be the first to leave one." }));
      return;
    }
    for (const n of [...NOTES].reverse()) {
      list.append(
        h("div", { class: "note" },
          h("p", { text: n.text }),
          h("small", { text: "\u2014 " + (n.name || "A visitor") + (n.date ? ", " + n.date : "") })
        )
      );
    }
  }
  renderNotes();

  $("#stickies").addEventListener("click", e => {
    e.preventDefault();
    $("#notes").scrollIntoView({ behavior: "smooth" });
    $("#noteText").focus({ preventScroll: true });
  });

  $("#noteForm").addEventListener("submit", e => {
    e.preventDefault();
    const status = $("#noteStatus");
    const name = $("#noteName").value.trim();
    const text = $("#noteText").value.trim();
    status.className = "status";
    if (!text) {
      status.textContent = "Write a note first.";
      status.classList.add("err");
      return;
    }
    if (!SITE.email) {
      status.textContent = "Notes aren't connected yet. Check back soon.";
      status.classList.add("err");
      return;
    }
    const subject = "Note for your library" + (name ? " from " + name : "");
    const bodyText = text + (name ? "\n\n\u2014 " + name : "");
    location.href = "mailto:" + encodeURIComponent(SITE.email).replace("%40", "@") +
      "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(bodyText);
    status.textContent = "Opening your email app. Thank you! Notes appear here once Yul publishes them.";
    $("#noteText").value = "";
  });

  $("#year").textContent = new Date().getFullYear();

  route();
})();
</script>
</body>
</html>
